name: Build and publish signed Android release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Set version
        run: |
          CODE=$((1000 + GITHUB_RUN_NUMBER))
          VERSION="1.3.$CODE-${GITHUB_SHA:0:7}"
          echo "APP_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
      - name: Restore permanent signing key (required)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Permanent signing key not configured'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/distribution.p12" >> "$GITHUB_ENV"
      - name: Build signed release and lint
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD"
          gradle --no-daemon :app:assembleRelease :app:lintRelease
      - name: Verify signature and publish release only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$APP_VERSION_NAME"
          APK="AICommandCenter-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Version already published; immutable APK retained.'
            exit 0
          fi
          # Do not let an older rerun replace the latest release.
          LATEST=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | sed -nE 's/^v1\.[0-9]+\.([0-9]+)-[0-9a-f]{7}$/\1/p' | sort -nr | head -1)
          if [ -n "$LATEST" ] && [ "$LATEST" -ge "$APP_VERSION_CODE" ]; then
            echo 'A newer or equal version already exists; skipping publication.'
            exit 0
          fi
          # Publish direct patches from up to five preceding stable APKs.
          # Missing bases or unhelpful deltas never prevent a full APK release.
          mkdir -p "$RUNNER_TEMP/delta-bases"
          ASSETS=("$APK")
          mapfile -t BASES < <(gh release list --limit 30 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' | grep -E '^v1\.[0-9]+\.[1-9][0-9]*-[0-9a-f]{7}$' | head -5 || true)
          for BASE_TAG in "${BASES[@]}"; do
            BASE_NAME="AICommandCenter-$BASE_TAG.apk"
            BASE="$RUNNER_TEMP/delta-bases/$BASE_NAME"
            if ! gh release download "$BASE_TAG" --pattern "$BASE_NAME" --dir "$RUNNER_TEMP/delta-bases"; then
              echo "Skipping unavailable base $BASE_TAG"; continue
            fi
            HASH=$(sha256sum "$BASE" | cut -d' ' -f1)
            PATCH="AICommandCenter-$TAG-from-$HASH.delta"
            if python3 scripts/apk_delta.py "$BASE" "$APK" "$PATCH" && [ $(( $(stat -c%s "$PATCH") * 10 )) -lt $(( $(stat -c%s "$APK") * 9 )) ]; then
              ASSETS+=("$PATCH")
            else
              rm -f "$PATCH"
            fi
          done
          gh release create "$TAG" "${ASSETS[@]}" --target "$GITHUB_SHA" --title "AI Command Center $APP_VERSION_NAME" --notes "Signed Android APK. Install over the previous release to retain profiles and settings. Version code: $APP_VERSION_CODE. Compatible delta patches are included when at least 10% smaller than the APK." --latest
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/distribution.p12"
